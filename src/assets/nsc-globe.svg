    <circle cx="460" cy="280" r="253" fill="url(#ocean)" stroke="#7ddfa6" stroke-opacity="0.16" stroke-width="1.4"/>
    <g clip-path="url(#sphereClip)">
      <rect x="180" y="20" width="600" height="520" fill="url(#ocean)"/>
      <g opacity="0.45" stroke="#6effb7" stroke-width="0.7">
        <ellipse cx="460" cy="280" rx="244" ry="82"/>
        <ellipse cx="460" cy="280" rx="244" ry="132"/>
        <ellipse cx="460" cy="280" rx="244" ry="190"/>
        <ellipse cx="460" cy="280" rx="82" ry="244"/>
        <ellipse cx="460" cy="280" rx="146" ry="244"/>
        <path d="M208 280H712"/>
        <path d="M460 28V532"/>
      </g>

      <!-- North America -->
      <path filter="url(#softGlow)" fill="url(#landGreen)" d="M224 212c24-48 80-78 129-77 37 1 50 22 76 30 25 8 64-5 84 17 18 21-7 54-30 65-28 13-56 2-79 17-23 16-25 50-51 60-26 11-49-14-68-30-23-20-72-30-61-82Z"/>
      <path fill="#0c2b22" opacity="0.5" d="M259 193c37-18 70-11 93 8 17 14 34 9 53 21-42 10-66 39-107 28-27-7-54-25-39-57Z"/>

