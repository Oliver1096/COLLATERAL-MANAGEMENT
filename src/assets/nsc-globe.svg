      <path filter="url(#softGlow)" fill="url(#landRed)" opacity="0.72" d="M718 390c31-15 80-7 100 20 13 17-5 37-36 36-36-1-74-28-64-56Z"/>
      <path fill="#62f49b" opacity="0.48" d="M667 337c28-7 56 4 66 31-31 8-55 2-66-31Z"/>

      <!-- night lights clusters -->
      <g filter="url(#cityGlow)">
        <g fill="#fff0a8" opacity="0.98">
          <circle cx="302" cy="199" r="1.7"/><circle cx="331" cy="207" r="1.4"/><circle cx="360" cy="225" r="1.2"/>
          <circle cx="395" cy="249" r="1.5"/><circle cx="432" cy="339" r="1.3"/><circle cx="424" cy="380" r="1.1"/>
          <circle cx="529" cy="198" r="1.8"/><circle cx="548" cy="207" r="1.4"/><circle cx="574" cy="213" r="1.6"/>
          <circle cx="604" cy="226" r="1.7"/><circle cx="625" cy="242" r="1.3"/><circle cx="651" cy="248" r="1.6"/>
          <circle cx="681" cy="255" r="1.4"/><circle cx="716" cy="270" r="1.7"/><circle cx="744" cy="287" r="1.2"/>
          <circle cx="778" cy="300" r="1.4"/><circle cx="570" cy="282" r="1.2"/><circle cx="585" cy="310" r="1.5"/>
          <circle cx="610" cy="346" r="1.2"/><circle cx="765" cy="412" r="1.4"/><circle cx="798" cy="423" r="1.2"/>
        </g>
        <g stroke="#fff0a8" stroke-width="0.55" opacity="0.42">
          <path d="M524 200c36 8 71 21 102 43"/><path d="M612 244c54 6 99 28 139 58"/>
          <path d="M300 200c42 17 75 38 101 64"/><path d="M548 210c16 43 33 79 52 114"/>
