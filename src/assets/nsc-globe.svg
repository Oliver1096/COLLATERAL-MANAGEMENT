      <path filter="url(#softGlow)" fill="url(#landGreen)" d="M504 188c24-29 69-37 103-17 22 13 34 1 53 13 20 12 17 33 0 44-31 18-59 0-92 9-28 8-62 16-78-8-10-15 0-27 14-41Z"/>

