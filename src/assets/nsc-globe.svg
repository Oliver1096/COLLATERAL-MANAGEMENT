<svg width="920" height="560" viewBox="0 0 920 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ocean" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(390 205) rotate(45) scale(360)">
      <stop offset="0" stop-color="#1a5a43"/>
      <stop offset="0.34" stop-color="#09221d"/>
      <stop offset="0.62" stop-color="#03100f"/>
      <stop offset="0.86" stop-color="#010404"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="terminator" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(342 142) rotate(43) scale(360)">
      <stop offset="0" stop-color="white" stop-opacity="0.25"/>
      <stop offset="0.26" stop-color="white" stop-opacity="0.06"/>
      <stop offset="0.56" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#000" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.96"/>
    </radialGradient>
    <linearGradient id="landGreen" x1="210" y1="120" x2="620" y2="405" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7df7aa" stop-opacity="0.82"/>
      <stop offset="0.48" stop-color="#23c763" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#094c32" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="landRed" x1="500" y1="160" x2="760" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e9443f" stop-opacity="0.54"/>
      <stop offset="1" stop-color="#55231d" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="softGlow" x="0" y="0" width="920" height="560" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.145 0 0 0 0 0.827 0 0 0 0 0.4 0 0 0 0.55 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cityGlow" x="0" y="0" width="920" height="560" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1 0 1 0 0 0.86 0 0 1 0 0.45 0 0 0 0.8 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sphereClip"><circle cx="460" cy="280" r="252"/></clipPath>
    <mask id="sphereMask"><rect width="920" height="560" fill="black"/><circle cx="460" cy="280" r="252" fill="white"/></mask>
  </defs>

  <g opacity="0.98">
