    <circle cx="460" cy="280" r="252" fill="none" stroke="#a7f3d0" stroke-opacity="0.2" stroke-width="1.2"/>
    <circle cx="460" cy="280" r="257" fill="none" stroke="#25d366" stroke-opacity="0.13" stroke-width="7"/>
    <path d="M244 151c88-104 289-150 418-50" stroke="#caffdf" stroke-opacity="0.28" stroke-width="2"/>
