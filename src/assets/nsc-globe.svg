      <!-- market heat overlay -->
      <g opacity="0.35" style="mix-blend-mode:screen">
        <circle cx="326" cy="220" r="62" fill="#25d366" opacity="0.28"/>
        <circle cx="585" cy="215" r="70" fill="#25d366" opacity="0.25"/>
        <circle cx="743" cy="279" r="86" fill="#ef4444" opacity="0.22"/>
